name: "Bug Report"
description: "Report a bug or issue with the application."
labels: ["bug"]
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: "Describe the bug or issue in detail to help us reproduce it."
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "The version of the application where the bug was found."
      placeholder: "e.g., v1.0.0"
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: "Description"
      description: "Describe the bug or issue in detail."
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "List the steps to reproduce the behavior."
      placeholder: "1. Go to '...'\n2. Click on '...'\n3. Scroll down to '...'\n4. See error"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Describe the environment where the bug occurred."
      placeholder: "e.g., FireFox 142, Chrome 140 or Safari 18"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "Paste any relevant logs or add screenshots."
      render: shell
